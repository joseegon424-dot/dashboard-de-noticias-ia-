<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Pulse — Dashboard de noticias de IA por Cognisium Lab" />
  <title>AI Pulse — Cognisium Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div class="app">

    <!-- ═══════════════════════════════════════════════ -->
    <!-- SIDEBAR                                        -->
    <!-- ═══════════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img src="/Guia de marca/logo.png" alt="Cognisium Lab" class="sidebar__logo" />
        <span class="sidebar__brand-text">COGNISIUM<br /><span>LAB</span></span>
      </div>

      <nav class="sidebar__nav">
        <button class="nav-btn active" data-view="all" id="nav-all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Todas las noticias</span>
        </button>
        <button class="nav-btn" data-view="saved" id="nav-saved">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
          <span>Guardados</span>
          <span class="nav-btn__count" id="saved-count">0</span>
        </button>
        <button class="nav-btn" data-view="dismissed" id="nav-dismissed">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="15" y1="9" x2="9" y2="15" />
            <line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span>Eliminados</span>
          <span class="nav-btn__count" id="dismissed-count">0</span>
        </button>
      </nav>

      <div class="sidebar__divider"></div>

      <!-- Source Filters -->
      <div class="sidebar__section">
        <p class="sidebar__label">FUENTES</p>
        <div id="source-filters"></div>
      </div>

      <div class="sidebar__spacer"></div>

      <div class="sidebar__footer">
        <button class="refresh-btn" id="btn-refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          Actualizar
        </button>
        <span class="sidebar__timestamp" id="last-updated"></span>
      </div>
    </aside>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- MAIN CONTENT                                   -->
    <!-- ═══════════════════════════════════════════════ -->
    <main class="main">

      <!-- HEADER BAR -->
      <header class="topbar">
        <div class="topbar__left">
          <button class="topbar__menu-btn" id="menu-toggle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <h1 class="topbar__title">AI <span>Pulse</span></h1>
        </div>
        <div class="topbar__center">
          <div class="topbar__search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Buscar noticias de IA…" />
            <kbd>/</kbd>
          </div>
        </div>
        <div class="topbar__right">
          <div class="topbar__status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Cargando…</span>
          </div>
        </div>
      </header>

      <!-- STATS ROW -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-card__value" id="stat-total">0</span>
          <span class="stat-card__label">Artículos</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-sources">0</span>
          <span class="stat-card__label">Fuentes</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-saved">0</span>
          <span class="stat-card__label">Guardados</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="stat-new">0</span>
          <span class="stat-card__label">Nuevos hoy</span>
        </div>
      </div>

      <!-- CATEGORY PILLS -->
      <div class="category-bar" id="category-bar">
        <button class="cat-pill active" data-category="all">🔥 Todas</button>
        <!-- Categories injected by JS -->
      </div>

      <!-- CONTENT AREA -->
      <div class="content-area">

        <!-- LOADING STATE -->
        <div class="loading-state" id="loading-state">
          <div class="loader">
            <div class="loader__bar"></div>
            <div class="loader__bar"></div>
            <div class="loader__bar"></div>
            <div class="loader__bar"></div>
            <div class="loader__bar"></div>
          </div>
          <p>Escaneando The Rundown AI…</p>
        </div>

        <!-- ARTICLES GRID -->
        <div class="articles-grid hidden" id="articles-grid"></div>

        <!-- EMPTY STATE -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-state__icon">∅</div>
          <h2>Sin artículos</h2>
          <p>No se encontraron noticias para este filtro. Prueba con otra categoría.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ARTICLE MODAL                                  -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal__topbar">
        <div class="modal__meta">
          <span class="modal__source" id="modal-source"></span>
          <span class="modal__date" id="modal-date"></span>
        </div>
        <button class="modal__close" id="modal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <h2 class="modal__title" id="modal-title"></h2>
      <div class="modal__categories" id="modal-categories"></div>
      <div class="modal__body" id="modal-content"></div>
      <div class="modal__actions">
        <a href="#" class="modal__link" id="modal-link" target="_blank" rel="noopener noreferrer">
          Leer artículo completo →
        </a>
        <div class="modal__btns">
          <button class="modal__action-btn modal__save-btn" id="modal-save">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
            Guardar
          </button>
          <button class="modal__action-btn modal__dismiss-btn" id="modal-dismiss">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast hidden" id="toast">
    <span id="toast-message"></span>
    <button class="toast__undo hidden" id="toast-undo">Deshacer</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
